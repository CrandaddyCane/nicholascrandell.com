<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Nicholas Crandell</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
      --text: #e8eaf0;
      --muted: #7a7f96;
      --error: #ff6b6b;
      --success: #4ecb91;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,140,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,140,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-initials {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.2rem; font-weight: 600; }
    .brand p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.4rem;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,140,255,0.12);
    }
    .btn {
      width: 100%;
      padding: 0.8rem;
      margin-top: 1rem;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.45;
      display: none;
    }
    .message.error {
      display: block;
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      color: var(--error);
    }
    .message.success {
      display: block;
      background: rgba(78,203,145,0.1);
      border: 1px solid rgba(78,203,145,0.3);
      color: var(--success);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-initials">NC</div>
      <h1>Forgot your password?</h1>
      <p>Enter your account email and I’ll send a recovery link to the password reset page.</p>
    </div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />

    <button class="btn" id="sendBtn">Send recovery email</button>
    <div class="message" id="message"></div>

    <a class="back-link" href="/login.html">Back to sign in</a>
  </div>

  <script type="module">
    import { supabase } from './auth.js';

    const email = document.getElementById('email');
    const sendBtn = document.getElementById('sendBtn');
    const message = document.getElementById('message');

    function setMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    async function sendRecovery() {
      const address = email.value.trim();

      if (!address) {
        setMessage('Enter your email address first.', 'error');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      const { error } = await supabase.auth.resetPasswordForEmail(address, {
        redirectTo: 'https://nicholascrandell.com/reset-password.html'
      });

      if (error) {
        setMessage(error.message || 'Unable to send the recovery email.', 'error');
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send recovery email';
        return;
      }

      setMessage('Recovery email sent. Check your inbox and open the link.', 'success');
      sendBtn.textContent = 'Email sent';
    }

    sendBtn.addEventListener('click', sendRecovery);

    document.addEventListener('keydown', event => {
      if (event.key === 'Enter') sendRecovery();
    });
  </script>
</body>
</html>
