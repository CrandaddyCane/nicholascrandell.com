<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Nicholas Crandell</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
      --text: #e8eaf0;
      --muted: #7a7f96;
      --error: #ff6b6b;
      --success: #4ecb91;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,140,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,140,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-initials {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.4rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.45rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,140,255,0.12);
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.45;
      display: none;
    }

    .message.error {
      display: block;
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      color: var(--error);
    }

    .message.success {
      display: block;
      background: rgba(78,203,145,0.1);
      border: 1px solid rgba(78,203,145,0.3);
      color: var(--success);
    }

    .message.info {
      display: block;
      background: rgba(108,140,255,0.08);
      border: 1px solid rgba(108,140,255,0.22);
      color: #b6c3ff;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover { color: var(--accent); }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <div class="brand-initials">NC</div>
      <h1>Reset your password</h1>
      <p>Choose a new password for the private area of nicholascrandell.com.</p>
    </div>

    <div class="field">
      <label for="password">New password</label>
      <input
        type="password"
        id="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="At least 8 characters"
        disabled
      />
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <input
        type="password"
        id="confirmPassword"
        autocomplete="new-password"
        minlength="8"
        placeholder="Re-enter your new password"
        disabled
      />
    </div>

    <button class="btn" id="resetBtn" disabled>Update password</button>

    <div class="message info" id="message">
      Verifying your password recovery link...
    </div>

    <a href="/login.html" class="back-link">Back to sign in</a>
  </div>

  <script type="module">
    import { supabase } from './auth.js';

    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const resetBtn = document.getElementById('resetBtn');
    const message = document.getElementById('message');

    let recoveryReady = false;

    function setMessage(text, type = 'info') {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function enableForm() {
      if (recoveryReady) return;
      recoveryReady = true;
      password.disabled = false;
      confirmPassword.disabled = false;
      resetBtn.disabled = false;
      setMessage('Recovery link verified. Enter your new password below.', 'info');
      password.focus();
    }

    async function detectRecoverySession() {
      // Supabase JS automatically reads the auth credentials returned in the
      // recovery URL. If a valid session already exists, allow the reset.
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error) {
        setMessage('The recovery link could not be verified. Request a new password recovery email.', 'error');
        return;
      }

      if (session) {
        enableForm();
      }
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) {
        enableForm();
      }
    });

    resetBtn.addEventListener('click', async () => {
      if (!recoveryReady) return;

      const newPassword = password.value;
      const confirmedPassword = confirmPassword.value;

      if (newPassword.length < 8) {
        setMessage('Your password must be at least 8 characters long.', 'error');
        return;
      }

      if (newPassword !== confirmedPassword) {
        setMessage('The passwords do not match.', 'error');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({
        password: newPassword
      });

      if (error) {
        setMessage(error.message || 'The password could not be updated. Please try again.', 'error');
        resetBtn.disabled = false;
        resetBtn.textContent = 'Update password';
        return;
      }

      setMessage('Password updated successfully. Redirecting you to sign in...', 'success');

      // End the recovery session so the user verifies the new password by signing in.
      await supabase.auth.signOut();

      setTimeout(() => {
        window.location.href = '/login.html';
      }, 1400);
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Enter' && recoveryReady) {
        resetBtn.click();
      }
    });

    detectRecoverySession();

    // If no recovery credentials arrive, avoid leaving the page in a permanent
    // "verifying" state.
    setTimeout(() => {
      if (!recoveryReady) {
        setMessage(
          'No valid recovery session was found. Please request a new password recovery email and open its link.',
          'error'
        );
      }
    }, 4000);
  </script>
</body>
</html>
